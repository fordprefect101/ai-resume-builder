<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assisted Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: radial-gradient(circle at center, #667eea 0%, #764ba2 100%);
        }
        .button-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .button-glow:hover {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.8);
        }
        .loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="text-center">
        <h1 class="text-white text-5xl font-bold mb-8 tracking-tight">
            AI-Assisted Resume Builder
        </h1>
        
        <button 
            id="buildButton"
            onclick="openInteractiveDocumentWidget()"
            class="group relative bg-white/50 backdrop-blur-md border border-white/60 hover:bg-white/60 text-blue-600 font-bold py-6 px-12 rounded-full text-xl shadow-2xl button-glow transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300 focus:ring-opacity-50"
        >
            <div class="flex items-center space-x-3">
                <!-- Microphone Icon -->
                <svg id="micIcon" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                
                <!-- Loading Spinner (hidden by default) -->
                <svg id="loadingSpinner" class="w-8 h-8 loading hidden" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                
                <span id="buttonText">Build with AI</span>
            </div>
        </button>
        
        <p class="text-white text-lg mt-6 opacity-90">
            Create your professional resume with voice assistance
        </p>
    </div>

    <!-- Resume Page Component -->
    <script type="module" src="src/components/ResumePage.tsx"></script>
    
    <!-- Form Components -->
    <script type="module" src="src/components/index.ts"></script>
    
    <!-- Widget script -->
    <script type="module" src="widget-loader.js"></script>
    
    <script>
        // Simple routing logic
        function handleRoute() {
            const hash = window.location.hash;
            const mainContent = document.querySelector('.text-center');
            const resumePage = document.querySelector('resume-page');
            
            // Check if we have a valid resume URL with sessionId
            const urlParams = new URLSearchParams(hash.split('?')[1] || '');
            const sessionId = urlParams.get('sessionId');
            const conversation = urlParams.get('conversation');
            
            if (hash.includes('resume') && (sessionId || conversation)) {
                // Show resume page if we have sessionId or conversation data
                if (mainContent) mainContent.style.display = 'none';
                if (!resumePage) {
                    const resumeElement = document.createElement('resume-page');
                    document.body.appendChild(resumeElement);
                }
            } else {
                // Show main page
                if (mainContent) mainContent.style.display = 'block';
                if (resumePage) resumePage.remove();
            }
        }
        
        // Handle initial route and route changes
        handleRoute();
        window.addEventListener('hashchange', handleRoute);
        
        // Add loading state when button is clicked
        document.getElementById('buildButton').addEventListener('click', function() {
            const button = this;
            const micIcon = document.getElementById('micIcon');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const buttonText = document.getElementById('buttonText');
            
            // Show loading state
            micIcon.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');
            buttonText.textContent = 'Starting...';
            button.disabled = true;
        });
        
        // Listen for widget close events to reset the button state
        window.addEventListener('widget-closed', function() {
            const button = document.getElementById('buildButton');
            const micIcon = document.getElementById('micIcon');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const buttonText = document.getElementById('buttonText');
            
            // Reset to original state
            micIcon.classList.remove('hidden');
            loadingSpinner.classList.add('hidden');
            buttonText.textContent = 'Build with AI';
            button.disabled = false;
        });
    </script>
</body>
</html>
